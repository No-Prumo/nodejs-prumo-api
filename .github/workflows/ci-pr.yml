name: CI PR

on:
  pull_request:
    branches:
      - developer
      - staging
      - master
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_call:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sandicts_ci

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate branch naming, PR title, PR description, and PR target
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          TITLE="$PR_TITLE"
          BODY="$PR_BODY"

          echo "Source branch: $HEAD"
          echo "Target branch: $BASE"
          echo "Pull request title: $TITLE"

          TEMP_BRANCH_REGEX='^(feature|fix|hotfix|docs|refactor|test|ci|chore|rc|codex)/KAN-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          PR_TITLE_REGEX='^\[KAN-[0-9]+\] (feat|fix|hotfix|docs|refactor|test|ci|chore|build|perf|style|revert)\([a-z0-9-]+\): .+$'

          is_valid_temp_branch=false
          is_valid_protected_branch=false
          is_valid_target=false
          is_valid_pr_title=false

          if [[ "$HEAD" =~ $TEMP_BRANCH_REGEX ]]; then
            is_valid_temp_branch=true
          fi

          if [[ "$HEAD" == "developer" || "$HEAD" == "staging" || "$HEAD" == "master" ]]; then
            is_valid_protected_branch=true
          fi

          if [[ "$BASE" == "developer" || "$BASE" == "staging" || "$BASE" == "master" ]]; then
            is_valid_target=true
          fi

          if [[ "$TITLE" =~ $PR_TITLE_REGEX ]]; then
            is_valid_pr_title=true
          fi

          if [[ "$is_valid_target" == "false" ]]; then
            echo "Invalid target branch: $BASE"
            echo "Allowed targets: developer, staging, master"
            exit 1
          fi

          if [[ "$is_valid_pr_title" == "false" ]]; then
            echo "Invalid pull request title: $TITLE"
            echo "Expected format: [KAN-123] type(scope): short summary"
            echo "Allowed types: feat, fix, hotfix, docs, refactor, test, ci, chore, build, perf, style, revert"
            echo "Allowed scope format: lowercase letters, numbers, and hyphens"
            echo "Example: [KAN-132] refactor(api-contract): Split API contract schemas"
            exit 1
          fi

          if [[ -z "${BODY//[[:space:]]/}" ]]; then
            echo "Invalid pull request description: body is empty"
            echo "Use .github/pull_request_template.md and replace the placeholders with this PR's details."
            exit 1
          fi

          required_sections=(
            "## Summary"
            "## Problem"
            "## Root cause"
            "## Changes"
            "## Files added or updated"
            "## Impact"
            "## Validation"
            "## Notes"
          )

          last_section_line=0
          for section in "${required_sections[@]}"; do
            section_line="$(grep -nF "$section" <<< "$BODY" | head -n 1 | cut -d: -f1)"
            if [[ -z "$section_line" ]]; then
              echo "Invalid pull request description: missing required section '$section'"
              echo "Keep the standard PR template headings and order."
              exit 1
            fi

            if (( section_line <= last_section_line )); then
              echo "Invalid pull request description: section '$section' is out of order"
              echo "Keep the standard PR template headings and order."
              exit 1
            fi

            last_section_line="$section_line"
          done

          raw_text_placeholders=(
            "Describe clearly what this pull request changes and the intended scope."
            "Explain the issue, need, or workflow gap this pull request addresses."
            "Explain the cause identified in code, flow, documentation, or configuration."
            "For docs-only or setup work, describe why the repository needed this change."
          )

          for placeholder in "${raw_text_placeholders[@]}"; do
            if grep -Fq -- "$placeholder" <<< "$BODY"; then
              echo "Invalid pull request description: raw template placeholder remains:"
              echo "  $placeholder"
              exit 1
            fi
          done

          raw_line_placeholder_patterns=(
            '^[[:space:]]*-[[:space:]]*item([[:space:]][0-9]+)?[[:space:]]*$'
            '^[[:space:]]*-[[:space:]]*`path/to/file`[[:space:]]*$'
            '^[[:space:]]*-[[:space:]]*relevant note[[:space:]]*$'
          )

          for placeholder_pattern in "${raw_line_placeholder_patterns[@]}"; do
            if grep -Eq -- "$placeholder_pattern" <<< "$BODY"; then
              echo "Invalid pull request description: raw template bullet remains"
              echo "Replace placeholder bullets with this PR's actual details."
              exit 1
            fi
          done

          TITLE_JIRA="$(sed -E 's/^\[(KAN-[0-9]+)\].*/\1/' <<< "$TITLE")"
          PRIMARY_JIRA_REGEX='^[[:space:]]*-?[[:space:]]*Primary Jira:[[:space:]]+`?'"$TITLE_JIRA"'`?[[:space:]]*$'
          if ! grep -Eq "$PRIMARY_JIRA_REGEX" <<< "$BODY"; then
            echo "Invalid pull request description: Notes must include Primary Jira matching the PR title"
            echo "Expected: Primary Jira: \`$TITLE_JIRA\`"
            exit 1
          fi

          if grep -Fq "REPLACE_WITH_" <<< "$BODY"; then
            echo "Invalid pull request description: unresolved specialized-template placeholder remains"
            exit 1
          fi

          if [[ "$BASE" == "developer" && "$is_valid_protected_branch" == "true" ]]; then
            echo "Invalid promotion direction: protected branches cannot merge back into developer"
            exit 1
          fi

          if [[ "$BASE" == "staging" && "$HEAD" != "developer" ]]; then
            echo "Invalid staging source: staging accepts promotions only from developer"
            exit 1
          fi

          if [[ "$BASE" == "master" && "$HEAD" != "staging" ]]; then
            echo "Invalid production source: master accepts promotions only from staging"
            exit 1
          fi

          if [[ "$BASE" == "staging" || "$BASE" == "master" ]]; then
            if [[ "$BASE" == "staging" ]]; then
              EXPECTED_PROMOTION_TITLE="[$TITLE_JIRA] chore(release): Promote developer to staging"
            else
              EXPECTED_PROMOTION_TITLE="[$TITLE_JIRA] chore(release): Promote staging to master"
            fi

            if [[ "$TITLE" != "$EXPECTED_PROMOTION_TITLE" ]]; then
              echo "Invalid promotion title: $TITLE"
              echo "Expected: $EXPECTED_PROMOTION_TITLE"
              exit 1
            fi

            promotion_fields=(
              "Release type:"
              "Promotion path:"
              "Source commit:"
              "Target environment:"
              "Rollback:"
            )

            for field in "${promotion_fields[@]}"; do
              if ! grep -Fq -- "$field" <<< "$BODY"; then
                echo "Invalid promotion description: missing '$field'"
                echo "Use .github/PULL_REQUEST_TEMPLATE/release-promotion.md."
                exit 1
              fi
            done

            if [[ "$BASE" == "master" ]]; then
              production_fields=("Preview deployment:" "Preview validation:")
              for field in "${production_fields[@]}"; do
                if ! grep -Fq -- "$field" <<< "$BODY"; then
                  echo "Invalid production promotion description: missing '$field'"
                  exit 1
                fi
              done
            fi
          fi

          if [[ "$TITLE" =~ \((dependencies|deps|security)\): ]]; then
            security_fields=(
              "Advisory:"
              "Severity:"
              "Affected package:"
              "Affected versions:"
              "Patched version:"
              "Dependency path:"
              "Audit result:"
              "Merge order:"
            )

            for field in "${security_fields[@]}"; do
              if ! grep -Fq -- "$field" <<< "$BODY"; then
                echo "Invalid vulnerability description: missing '$field'"
                echo "Use .github/PULL_REQUEST_TEMPLATE/vulnerability-remediation.md."
                exit 1
              fi
            done
          fi

          if [[ "$is_valid_temp_branch" == "false" && "$is_valid_protected_branch" == "false" ]]; then
            echo "Invalid source branch name: $HEAD"
            echo "Allowed examples:"
            echo "  feature/KAN-123-create-login-flow"
            echo "  fix/KAN-456-correct-timeout"
            echo "  hotfix/KAN-789-fix-production-crash"
            echo "  docs/KAN-234-update-api-docs"
            echo "  refactor/KAN-345-reorganize-auth-module"
            echo "  test/KAN-567-add-auth-coverage"
            echo "  ci/KAN-678-update-pr-checks"
            echo "  chore/KAN-321-update-ci"
            echo "  rc/KAN-654-release-candidate"
            echo "  codex/KAN-107-ai-doc-routing"
            echo "  developer"
            echo "  staging"
            echo "  master"
            exit 1
          fi

      - name: Validate reusable CI caller
        if: github.event_name != 'pull_request'
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "Reusable CI accepts only staging or master push callers."
            exit 1
          fi

          if [[ "${{ github.ref_name }}" != "staging" && "${{ github.ref_name }}" != "master" ]]; then
            echo "Invalid reusable CI caller branch: ${{ github.ref_name }}"
            exit 1
          fi

  quality:
    name: Quality
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error('Expected Node.js 24, received ' + process.version); }"
          npm_major="$(npm --version | cut -d. -f1)"
          if [ "$npm_major" != "11" ]; then
            echo "Expected npm 11.x, received $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error('Expected Node.js 24, received ' + process.version); }"
          npm_major="$(npm --version | cut -d. -f1)"
          if [ "$npm_major" != "11" ]; then
            echo "Expected npm 11.x, received $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

  contract:
    name: Contract
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error('Expected Node.js 24, received ' + process.version); }"
          npm_major="$(npm --version | cut -d. -f1)"
          if [ "$npm_major" != "11" ]; then
            echo "Expected npm 11.x, received $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenAPI artifact
        run: npm run openapi:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error('Expected Node.js 24, received ' + process.version); }"
          npm_major="$(npm --version | cut -d. -f1)"
          if [ "$npm_major" != "11" ]; then
            echo "Expected npm 11.x, received $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build --tag "sandicts-api-ci:${{ github.sha }}" .

      - name: Verify Docker runtime
        env:
          IMAGE_TAG: sandicts-api-ci:${{ github.sha }}
        run: |
          set -euo pipefail

          container_name="sandicts-api-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container_name" 2>/dev/null || true
            docker rm --force "$container_name" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" --publish 3000:3000 \
            --env NODE_ENV=test \
            --env APP_ENV=test \
            --env DATABASE_URL="$DATABASE_URL" \
            "$IMAGE_TAG"

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health/live >/dev/null; then
              ready=true
              break
            fi

            if ! docker inspect --format '{{.State.Running}}' "$container_name" | grep -qx true; then
              echo "Container exited before liveness succeeded."
              exit 1
            fi

            sleep 2
          done

          if [[ "$ready" != "true" ]]; then
            echo "Container did not pass /health/live within 60 seconds."
            exit 1
          fi

          configured_user="$(docker inspect --format '{{.Config.User}}' "$container_name")"
          if [[ "$configured_user" != "node" ]]; then
            echo "Expected non-root Docker user 'node', received '$configured_user'."
            exit 1
          fi

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error('Expected Node.js 24, received ' + process.version); }"
          npm_major="$(npm --version | cut -d. -f1)"
          if [ "$npm_major" != "11" ]; then
            echo "Expected npm 11.x, received $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
