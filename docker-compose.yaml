services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: sandicts-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  postgres:
    image: postgres:18-bookworm
    container_name: sandicts-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_18_data:
    name: sandicts-postgres-18-data
